name = "pixelabs-admin"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Only reachable through admin.pixelabs.co (protected by Cloudflare Access).
# The *.workers.dev and preview URLs are turned off so Access can't be bypassed.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "admin.pixelabs.co", custom_domain = true }
]

# Keep the variables and secrets you set in the Cloudflare dashboard on each deploy.
keep_vars = true

[vars]
CLOUDINARY_CLOUD_NAME = "pixellabs"

# Set these in the dashboard (Worker → Settings → Variables and Secrets):
#   CLOUDINARY_API_KEY     (secret)
#   CLOUDINARY_API_SECRET  (secret)
#   ACCESS_TEAM_DOMAIN     e.g. yourteam.cloudflareaccess.com
#   ACCESS_AUD             Access application's AUD tag
#   ALLOWED_EMAILS         comma-separated list of allowed emails
