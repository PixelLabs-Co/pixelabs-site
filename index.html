<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Labs | We'll Be Right Back</title>
  <meta name="description" content="Pixel Labs is briefly offline. Our portfolio is still up, or reach out at info@pixelabs.co." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://www.pixelabs.co/" />

  <!-- Browser theme color (purple) -->
  <meta name="theme-color" content="#7d03d8" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    @font-face {
      font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 800; font-display: swap;
      src: url(fonts/bricolage-grotesque-800-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'DM Sans'; font-style: normal; font-weight: 400; font-display: swap;
      src: url(fonts/dm-sans-400-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'JetBrains Mono'; font-style: normal; font-weight: 500; font-display: swap;
      src: url(fonts/jetbrains-mono-500-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: #0e0624; color: #f5eeff;
      font-family: 'DM Sans', sans-serif;
    }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2rem; text-align: center; padding: 2rem; min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(125,3,216,0.16) 0%, transparent 60%), #0e0624;
    }
    .logo { height: 44px; width: auto; }
    h1 {
      font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
      font-size: clamp(2.5rem, 7vw, 4.5rem); letter-spacing: -0.03em; line-height: 1;
    }
    p {
      font-size: 1.05rem; color: #c7bfdb; max-width: 440px; line-height: 1.6;
    }
    .actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    a.btn {
      font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; letter-spacing: 0.08em;
      text-transform: uppercase; text-decoration: none; padding: 0.9rem 1.8rem;
      transition: opacity 0.2s;
    }
    a.btn:hover { opacity: 0.85; }
    .btn-primary { background: linear-gradient(135deg, #510490 0%, #7d03d8 100%); color: #f5eeff; }
    .btn-ghost { border: 1px solid #2a2347; color: #f5eeff; }
  </style>
</head>
<body>
  <img src="logo-lockup.png" alt="Pixel Labs" class="logo" />
  <h1>We'll be right back.</h1>
  <p>Pixel Labs is taking a short pause. Feel free to look through our portfolio, or reach out directly — we'll get back to you soon.</p>
  <div class="actions">
    <a href="/portfolio.html" class="btn btn-primary">View Our Work</a>
    <a href="mailto:info@pixelabs.co" class="btn btn-ghost">Email Us</a>
  </div>
</body>
</html>
